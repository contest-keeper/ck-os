[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/ck-agent-capture"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/ck-os"
rust-version = "1.87"

[workspace.dependencies]
ck-crypto = { git = "https://github.com/contest-keeper/ck-protocol", rev = "e2c72b0378696447049a0dbe9df29e87bca2b46d", version = "0.1.0" }
ck-image = { git = "https://github.com/contest-keeper/ck-protocol", rev = "e2c72b0378696447049a0dbe9df29e87bca2b46d", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "e2c72b0378696447049a0dbe9df29e87bca2b46d", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

