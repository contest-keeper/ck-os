[package]
name = "ck-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ck-agent-config = { path = "../ck-agent-config", version = "0.1.0" }
ck-agent-uplink = { path = "../ck-agent-uplink", version = "0.1.0" }
ck-capture = { path = "../ck-capture", version = "0.1.0" }
ck-crypto.workspace = true
ck-protocol.workspace = true
ck-selftest = { path = "../ck-selftest", version = "0.1.0" }
clap = { version = "4.5.51", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.47", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
