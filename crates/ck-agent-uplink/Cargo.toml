sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset"] }
tracing = "0.1.44"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
