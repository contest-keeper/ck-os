name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  patch-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run image patch regression tests
        env:
          CK_KEYRING_TEST_REQUIRED: '1'
        run: python3 -m unittest discover -s tests -v
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-about
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ck-os-agent
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p ck-agent
      - name: Check the agent is static
        run: file target/x86_64-unknown-linux-musl/release/ck-agent | grep -q "statically linked"
      - name: Write the third-party licences of the agent
        # Fails on a licence that is not allowed (about.toml) or on an empty result.
        run: |
          mkdir -p out
          cargo about generate --locked --manifest-path crates/ck-agent/Cargo.toml about.hbs \
            -o out/THIRD-PARTY-LICENSES-ck-agent.txt
          grep -q "Permission is hereby granted" out/THIRD-PARTY-LICENSES-ck-agent.txt
          grep -q "Apache License" out/THIRD-PARTY-LICENSES-ck-agent.txt
