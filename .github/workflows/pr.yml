name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    uses: contest-keeper/.github/.github/workflows/pr-title.yml@main
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  patch-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run image patch regression tests
        run: python3 -m unittest discover -s tests -v
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p ck-agent
      - name: Check the agent is static
        run: file target/x86_64-unknown-linux-musl/release/ck-agent | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: ck-agent-linux
          path: target/x86_64-unknown-linux-musl/release/ck-agent
          if-no-files-found: error
