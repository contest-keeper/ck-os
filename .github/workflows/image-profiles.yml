name: Image profile boot test

# Builds each image profile and boots it in UEFI, Secure Boot and BIOS. The default (ubuntu) image is then booted once
# more with the full checks suite (CK1 and up, tools/qemu-smoke checks), which is the only place the checks run in CI.
# The protected variants (read-only root, dm-verity, signed boot image; docs/protected-image.md) are built on Debian,
# which is quicker, with a signing key made inside the job and thrown away with it, and are booted in UEFI only.
# It never publishes: no environment, no cloud sign-in, and the image carries the CI test key and an empty root
# password (--debug-login), so it must never leave the job.
# The same paths run on pushes to develop, so a merge that breaks a check shows up there too.
on:
  pull_request:
    paths:
      - '.github/workflows/image-profiles.yml'
      - 'image/**'
      - 'tools/build-image'
      - 'tools/qemu-smoke'
      - 'tools/ci-test-config-keys'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/image-profiles.yml'
      - 'image/**'
      - 'tools/build-image'
      - 'tools/qemu-smoke'
      - 'tools/ci-test-config-keys'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Ubuntu archive snapshot server answers slowly to the runners at times (the package install of
          # the image took over 20 minutes and never finished). A boot test does not need the pinned snapshot, so
          # it takes the archive mirror the runners themselves use. The published image (keeper-image.yml) still
          # builds from the snapshot.
          - name: ubuntu
            profile: ubuntu
            checks: true
            modes: all
            mirror: http://azure.archive.ubuntu.com/ubuntu
          - name: debian
            profile: debian
            checks: false
            modes: all
            mirror: ''
          - name: mint
            profile: mint
            checks: false
            modes: all
            mirror: http://azure.archive.ubuntu.com/ubuntu
          # Protected variants. UEFI only, so no BIOS boot.
          - name: debian-readonly
            profile: debian
            checks: false
            build: --read-only-root
            modes: layout
          - name: debian-verity
            profile: debian
            checks: false
            build: --verity
            modes: verity tamper
          - name: debian-signed
            profile: debian
            checks: false
            build: --verity --uki
            modes: signed refused tamper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ck-os-agent
      - name: Build the static agent
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p ck-agent
      - name: Install Linux image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosfstools fdisk mmdebstrap ovmf qemu-system-x86 zstd debian-archive-keyring \
            cryptsetup-bin systemd-ukify python3-pefile sbsigntool systemd-boot-efi python3-virt-firmware
      - name: Set the download cache folder
        run: echo "CK_CACHE=$RUNNER_TEMP/ck-os-build" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ck-os-build
          key: keeper-downloads-${{ matrix.profile }}-${{ hashFiles('tools/build-image', 'image/profiles/**') }}
          restore-keys: keeper-downloads-${{ matrix.profile }}-
      - name: Build the image
        env:
          BUILD_ARGS: ${{ matrix.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/image" "$CK_CACHE"
          # A build that hangs gives no log. After 25 minutes (a build takes 5 to 15) print what is running, so the
          # stuck package script or download shows up in the job log, then stop the job instead of waiting an hour.
          (
            set +e # the step runs with errexit and pipefail; a failed diagnostic must not skip the pkill below
            sleep 1500
            echo "::warning::the image build is still running after 25 minutes; process list follows"
            ps -eo pid,ppid,etime,stat,wchan:24,args --forest | cut -c1-200
            sudo ss -tinp 2>/dev/null | grep -A1 ':443' | head -30
            # The file apt is fetching right now, and how much of it has arrived.
            sudo find /tmp -path '*/var/cache/apt/archives/partial/*' -ls 2>/dev/null | head
            sudo find /tmp -path '*/var/cache/apt/archives/*.deb' -newermt '-2 minutes' -ls 2>/dev/null | head
            sudo pkill -f tools/build-image
          ) &
          watchdog=$!
          args=()
          for arg in $BUILD_ARGS; do
            if [[ $arg == --uki ]]; then
              # A key for this job only: it signs the test image and goes away with the runner.
              openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Keeper OS CI test boot key" \
                -keyout "$RUNNER_TEMP/uki.key" -out "$RUNNER_TEMP/uki.crt"
              args+=(--uki-key "$RUNNER_TEMP/uki.key" --uki-cert "$RUNNER_TEMP/uki.crt")
            else
              args+=("$arg")
            fi
          done
          sudo env CK_CACHE="$CK_CACHE" CK_MIRROR="${{ matrix.mirror }}" tools/build-image --profile "${{ matrix.profile }}" --no-compress --out "$RUNNER_TEMP/image" \
            --agent "$PWD/target/x86_64-unknown-linux-musl/release/ck-agent" \
            --config-public-keys tools/ci-test-config-keys --serial-console --debug-login "${args[@]}"
          kill "$watchdog"
      - name: Make the download cache readable for saving
        if: success()
        run: |
          sudo rm -rf "$CK_CACHE"/apt-*/partial "$CK_CACHE"/apt-*/lock
          sudo chown -R "$USER" "$CK_CACHE"
      - name: Boot in QEMU
        env:
          MODES: ${{ matrix.modes }}
        run: |
          image=$(ls "$RUNNER_TEMP"/image/keeper-os-*.img)
          failed=0
          for mode in $MODES; do
            # signed boots with the job's certificate enrolled in the firmware; refused and tamper must NOT reach a login.
            timeout=360
            [[ $mode == refused || $mode == tamper ]] && timeout=150
            sudo env CK_UKI_CERT="$RUNNER_TEMP/uki.crt" tools/qemu-smoke "$image" "$mode" "$timeout" || failed=1
          done
          exit "$failed"
      # The checks suite assumes the Ubuntu profile (Firefox pin, Xubuntu menu paths), so only that one runs it.
      - name: Run the checks suite in QEMU
        if: matrix.checks
        run: |
          image=$(ls "$RUNNER_TEMP"/image/keeper-os-*.img)
          sudo tools/qemu-smoke "$image" checks 900
