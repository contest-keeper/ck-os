name: Image profile boot test

# Builds a non-default image profile and boots it in UEFI, Secure Boot and BIOS. It never publishes:
# no environment, no cloud sign-in, and the image carries the CI test key.
on:
  pull_request:
    paths:
      - '.github/workflows/image-profiles.yml'
      - 'image/profiles/**'
      - 'tools/build-image'
      - 'tools/qemu-smoke'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [debian, mint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ck-os-agent
      - name: Build the static agent
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p ck-agent
      - name: Install Linux image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosfstools fdisk mmdebstrap ovmf qemu-system-x86 zstd debian-archive-keyring
      - name: Build the image
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          sudo tools/build-image --profile "${{ matrix.profile }}" --no-compress --out "$RUNNER_TEMP/image" \
            --agent "$PWD/target/x86_64-unknown-linux-musl/release/ck-agent" \
            --config-public-keys tools/ci-test-config-keys --serial-console
      - name: Boot UEFI, Secure Boot and BIOS in QEMU
        run: |
          image=$(ls "$RUNNER_TEMP"/image/keeper-os-*.img)
          sudo tools/qemu-smoke "$image" all 360
