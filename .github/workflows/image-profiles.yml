name: Image profile boot test

# Builds each image profile and boots it in UEFI, Secure Boot and BIOS. The protected variants (read-only root,
# dm-verity, signed boot image; docs/protected-image.md) are built on Debian, which is quicker, with a signing key
# made inside the job and thrown away with it, and are booted in UEFI only. It never publishes: no environment, no
# cloud sign-in, and the image carries the CI test key and an empty root password (--debug-login).
on:
  pull_request:
    paths:
      - '.github/workflows/image-profiles.yml'
      - 'image/**'
      - 'tools/build-image'
      - 'tools/qemu-smoke'
      - 'tools/ci-test-config-keys'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/image-profiles.yml'
      - 'image/**'
      - 'tools/build-image'
      - 'tools/qemu-smoke'
      - 'tools/ci-test-config-keys'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            profile: debian
            checks: false
            modes: all
          - name: mint
            profile: mint
            checks: false
            modes: all
          # Protected variants. UEFI only, so no BIOS boot.
          - name: debian-readonly
            profile: debian
            checks: false
            build: --read-only-root
            modes: layout
          - name: debian-verity
            profile: debian
            checks: false
            build: --verity
            modes: verity tamper
          - name: debian-signed
            profile: debian
            checks: false
            build: --verity --uki
            modes: signed refused tamper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ck-os-agent
      - name: Build the static agent
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p ck-agent
      - name: Install Linux image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosfstools fdisk mmdebstrap ovmf qemu-system-x86 zstd debian-archive-keyring \
            cryptsetup-bin systemd-ukify python3-pefile sbsigntool systemd-boot-efi python3-virt-firmware
      - name: Build the image
        env:
          BUILD_ARGS: ${{ matrix.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          args=()
          for arg in $BUILD_ARGS; do
            if [[ $arg == --uki ]]; then
              # A key for this job only: it signs the test image and goes away with the runner.
              openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Keeper OS CI test boot key" \
                -keyout "$RUNNER_TEMP/uki.key" -out "$RUNNER_TEMP/uki.crt"
              args+=(--uki-key "$RUNNER_TEMP/uki.key" --uki-cert "$RUNNER_TEMP/uki.crt")
            else
              args+=("$arg")
            fi
          done
          sudo tools/build-image --profile "${{ matrix.profile }}" --no-compress --out "$RUNNER_TEMP/image" \
            --agent "$PWD/target/x86_64-unknown-linux-musl/release/ck-agent" \
            --config-public-keys tools/ci-test-config-keys --serial-console --debug-login "${args[@]}"
      - name: Boot in QEMU
        env:
          MODES: ${{ matrix.modes }}
        run: |
          image=$(ls "$RUNNER_TEMP"/image/keeper-os-*.img)
          failed=0
          for mode in $MODES; do
            # signed boots with the job's certificate enrolled in the firmware; refused and tamper must NOT reach a login.
            timeout=360
            [[ $mode == refused || $mode == tamper ]] && timeout=150
            sudo env CK_UKI_CERT="$RUNNER_TEMP/uki.crt" tools/qemu-smoke "$image" "$mode" "$timeout" || failed=1
          done
          exit "$failed"
