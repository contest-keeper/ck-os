name: Keeper OS image

on:
  push:
    branches: [develop]
    # Every deploy of develop publishes new images; a change to docs alone does not need one.
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:
    inputs:
      tag:
        description: Release tag created by release-please
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

# One run at a time: all jobs update the same image index, which a second writer must not overwrite.
concurrency:
  group: keeper-os-image-${{ github.ref == 'refs/heads/develop' && 'develop' || 'production' }}
  cancel-in-progress: false

jobs:
  image:
    name: image (${{ matrix.profile }})
    if: >-
      (github.ref == 'refs/heads/develop' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [ubuntu, debian, mint]
    # Configure the existing environment approval and a separate blob-scoped OIDC publisher for
    # each target. Enable CK_IMAGE_PUBLISH_ENABLED in that environment once it is ready.
    environment: ${{ github.ref == 'refs/heads/develop' && 'develop' || 'production' }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Set the image version
        run: |
          version=$(cat version.txt)
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" == "v$version" ]]
          else
            version="$version-dev.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
            printf '%s\n' "$version" > version.txt
          fi
          # build-image names the files and the image after the profile, except for the default (ubuntu).
          [[ "${{ matrix.profile }}" == ubuntu ]] || version="$version-${{ matrix.profile }}"
          echo "KEEPER_IMAGE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild,cargo-about
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ck-os-agent
      - name: Build the static agent
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p ck-agent
          file target/x86_64-unknown-linux-musl/release/ck-agent | grep -q "statically linked"
      - name: Check the agent's third-party licences
        run: |
          notices="$RUNNER_TEMP/THIRD-PARTY-LICENSES-ck-agent.txt"
          cargo about generate --locked --manifest-path crates/ck-agent/Cargo.toml about.hbs -o "$notices"
          grep -q "Permission is hereby granted" "$notices"
          grep -q "Apache License" "$notices"
      - name: Install Linux image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosfstools fdisk mmdebstrap ovmf qemu-system-x86 zstd debian-archive-keyring
      # The packages and downloads of the build, kept between runs: the snapshot server is slow to the runners.
      # build-image checks the pinned downloads against their hash on every use. apt does not hash a cached .deb
      # again (it compares name and size), so this cache is trusted: only this workflow may write it.
      - name: Set the download cache folder
        run: echo "CK_CACHE=$RUNNER_TEMP/ck-os-build" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ck-os-build
          key: keeper-downloads-${{ matrix.profile }}-${{ hashFiles('tools/build-image', 'image/profiles/**') }}
          restore-keys: keeper-downloads-${{ matrix.profile }}-
      - name: Build the distribution image
        # When the image is built again below, this smoke build is thrown away, so it is not compressed
        # (compressing takes about 12 of its 19 minutes). Without the second build it is the one verified.
        env:
          SMOKE_COMPRESS: ${{ (vars.CK_IMAGE_PUBLISH_ENABLED == 'true' || inputs.tag != '') && '--no-compress' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/keeper-image"
          # shellcheck disable=SC2086 # SMOKE_COMPRESS is empty or one flag
          sudo --preserve-env=CK_CACHE tools/build-image --out "$RUNNER_TEMP/keeper-image" \
            --agent "$PWD/target/x86_64-unknown-linux-musl/release/ck-agent" \
            --config-public-keys tools/ci-test-config-keys --serial-console $SMOKE_COMPRESS --profile "${{ matrix.profile }}"
      - name: Boot UEFI, Secure Boot and BIOS in QEMU
        run: sudo tools/qemu-smoke "$RUNNER_TEMP/keeper-image/keeper-os-$KEEPER_IMAGE_VERSION.img" all 360
      # The smoke build above carries a CI test key, so it can never be published. A build that is
      # published (or released) is built again with the Hub's public keys and fails without them.
      - name: Build again with the keys that sign stick settings
        if: vars.CK_IMAGE_PUBLISH_ENABLED == 'true' || inputs.tag != ''
        env:
          CK_CONFIG_PUBLIC_KEYS: ${{ vars.CK_CONFIG_PUBLIC_KEYS }}
        run: |
          printf '%s\n' "$CK_CONFIG_PUBLIC_KEYS" >"$RUNNER_TEMP/config-public-keys"
          if ! grep -qvE '^[[:space:]]*(#|$)' "$RUNNER_TEMP/config-public-keys"; then
            echo "::error::CK_CONFIG_PUBLIC_KEYS is empty: a published image must carry the Hub's settings keys"
            exit 1
          fi
          if grep -qF -f <(grep -vE '^[[:space:]]*(#|$)' tools/ci-test-config-keys) "$RUNNER_TEMP/config-public-keys"; then
            echo "::error::CK_CONFIG_PUBLIC_KEYS holds the CI test key"
            exit 1
          fi
          sudo --preserve-env=CK_CACHE tools/build-image --out "$RUNNER_TEMP/keeper-image" \
            --agent "$PWD/target/x86_64-unknown-linux-musl/release/ck-agent" \
            --config-public-keys "$RUNNER_TEMP/config-public-keys" --profile "${{ matrix.profile }}"
      # The cache is saved by the runner user, which cannot read apt's root-only download folders.
      - name: Make the download cache readable for saving
        if: success()
        run: |
          sudo rm -rf "$CK_CACHE"/apt-*/partial "$CK_CACHE"/apt-*/lock
          sudo chown -R "$USER" "$CK_CACHE"
      - name: Verify the packaged files and stage the Hub manifest
        run: |
          python3 tools/publish-image "$RUNNER_TEMP/keeper-image" "$KEEPER_IMAGE_VERSION" \
            > "$RUNNER_TEMP/keeper-image/images.json"
      - name: Sign in to the private downloads account
        if: vars.CK_IMAGE_PUBLISH_ENABLED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.CK_IMAGE_PUBLISH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish image and Hub manifest
        if: vars.CK_IMAGE_PUBLISH_ENABLED == 'true'
        env:
          DOWNLOAD_ACCOUNT: ${{ vars.CK_IMAGE_DOWNLOAD_ACCOUNT }}
        run: |
          : "${DOWNLOAD_ACCOUNT:?missing CK_IMAGE_DOWNLOAD_ACCOUNT for this environment}"
          python3 tools/publish-image "$RUNNER_TEMP/keeper-image" "$KEEPER_IMAGE_VERSION" --account "$DOWNLOAD_ACCOUNT"
