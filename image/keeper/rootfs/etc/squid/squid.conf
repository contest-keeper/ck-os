# Keeper OS Squid: the web goes through here or nowhere (see /etc/ck/netlock.nft). Only the sites the
# admin allowed are reachable; ck-agent writes them to acl_allowed_domains.txt at boot, before Squid starts.
# Files for the Keeper OS image only. The ICPC image keeps the squid.conf it came with.

# Listens on this machine only. The per-stick CA is made at first boot by ck-squid-ca.
http_port 127.0.0.1:3128 ssl-bump tls-cert=/etc/ck/squid-ca/ca.crt tls-key=/etc/ck/squid-ca/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 16MB
sslcrtd_children 5

acl allowed_domains dstdomain "/etc/squid/acl_allowed_domains.txt"

# Look at the name the browser asks for, decrypt the allowed sites, close everything else.
acl ck_step1 at_step SslBump1
ssl_bump peek ck_step1
ssl_bump bump allowed_domains
ssl_bump terminate all

# A site whose certificate is wrong is refused: nothing is "allowed all" (the browser would show a lock for
# a site Squid could not check).
sslproxy_cert_error deny all

http_access allow allowed_domains
http_access deny all

cache deny all
via off
forwarded_for delete
coredump_dir /var/spool/squid

# ck-capture (ICAP) and the other Keeper rules.
include /etc/squid/ck-capture.conf
