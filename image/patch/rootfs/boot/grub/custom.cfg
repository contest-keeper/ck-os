# Keeper OS: lock the boot menu. grub.cfg reads this file just before it shows the menu.
#
# After a power cut during boot GRUB shows its menu for a few seconds. Without a lock the contestant
# could press e to change the kernel command line (init=/bin/bash gives a root shell, outside the
# network lock) or open "Advanced options", whose recovery mode gives a root shell too.
#
# The superuser's password was made at random and thrown away, so nobody can log in as it. Editing,
# the GRUB command line and "Advanced options" are closed to everyone. apply-to-image.sh marks the
# entries at the top of the menu --unrestricted, so the stick still boots without a password.
# To get into GRUB again, write the stick anew with Keeper Forge.
set superusers="ck"
password_pbkdf2 ck grub.pbkdf2.sha512.10000.92AB40EA76CD4DE7C35B4B8E4235782F7428BFD9AA45F7E79FEB8AFE61E2200AC5D19E3131F8BF41AC97306E3F5E145DEAA725C4D0BB1BFE36D320B8F2030250.38DAC06829716EC8767E551002F45227A3A44F73D47D6FCFA81183E2CDF3E924892611D4E26EB57FAF04347B4B0544C57E49DF7A6803F227C85732D7EFCAD235
