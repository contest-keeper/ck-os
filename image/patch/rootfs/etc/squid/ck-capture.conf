# Keeper OS: hands the traffic to the sites the contest allows to ck-capture, which only looks.
# bypass=on: when ck-capture is not running, which is the case on every real stick, Squid carries on
# without it and no traffic is held up.
icap_enable on
# Squid gives ICAP a preview of 48 KB (ck-capture asks for it), but by default reads only 16 KB of a
# response ahead while nothing has gone to the browser yet. The preview would then never fill and
# the page would hang until the browser gave up. The read-ahead must be bigger than the preview.
read_ahead_gap 256 KB
# ck-capture reads the text of the pages, and a page the site compressed cannot be read. The sites the
# contest allows are asked for the page as it is, so the logged-in name can be found in it.
request_header_access Accept-Encoding deny allowed_domains
icap_service ck_req reqmod_precache icap://127.0.0.1:1344/reqmod bypass=on on-overload=bypass
icap_service ck_resp respmod_precache icap://127.0.0.1:1344/respmod bypass=on on-overload=bypass
# Cloudflare's bot check is not what is observed and must not be held up by it.
acl ck_cloudflare dstdomain .cloudflare.com .cloudflare.net
acl ck_cdn_cgi urlpath_regex ^/cdn-cgi/
adaptation_access ck_req deny ck_cloudflare
adaptation_access ck_req deny ck_cdn_cgi
adaptation_access ck_resp deny ck_cloudflare
adaptation_access ck_resp deny ck_cdn_cgi
adaptation_access ck_req allow allowed_domains
adaptation_access ck_req deny all
adaptation_access ck_resp allow allowed_domains
adaptation_access ck_resp deny all
